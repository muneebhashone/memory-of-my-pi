<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory of my Pi — configuration dump</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --fg: #e6edf3;
    --muted: #8b949e; --accent: #58a6ff; --accent2: #3fb950; --warn: #d29922;
    --code: #0b0f14; --sel: #1f6feb33;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
  #app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  .brand h1 { margin: 0 0 4px; font-size: 15px; }
  .brand .meta { color: var(--muted); font-size: 11px; line-height: 1.5; }
  .search { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .search input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: 6px; padding: 7px 9px; font-size: 13px; }
  .search input:focus { outline: none; border-color: var(--accent); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .chip { font-size: 11px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; color: var(--muted); user-select: none; }
  .chip.on { border-color: var(--accent); color: var(--accent); background: var(--sel); }
  .tree { overflow: auto; flex: 1; padding: 6px 4px 40px; }
  .cat { margin: 8px 0 2px; padding: 4px 10px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .node { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .node.file { padding-left: 22px; }
  .node:hover { background: #ffffff10; }
  .node.active { background: var(--sel); color: var(--accent); }
  .node .nm { overflow: hidden; text-overflow: ellipsis; }
  .node.dir { color: var(--muted); }
  .badge { font-size: 9px; padding: 0 4px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
  .badge.redact { color: var(--warn); border-color: var(--warn); }
  .count { margin-left: auto; color: var(--muted); font-size: 10px; font-family: var(--mono); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .filehead { padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .filehead .p { font-family: var(--mono); font-size: 13px; color: var(--accent); word-break: break-all; }
  .filehead .info { color: var(--muted); font-size: 11px; margin-top: 5px; line-height: 1.6; }
  .filehead .info code { color: var(--fg); }
  .filehead .desc { color: var(--fg); font-size: 12px; margin-top: 6px; }
  .content { overflow: auto; flex: 1; background: var(--code); }
  pre { margin: 0; padding: 16px 18px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; white-space: pre; tab-size: 2; }
  .empty { padding: 40px; color: var(--muted); max-width: 760px; }
  .empty h2 { color: var(--fg); font-size: 18px; }
  .empty code { background: #ffffff10; padding: 1px 5px; border-radius: 4px; font-family: var(--mono); }
  .empty a { color: var(--accent); }
  .empty table { border-collapse: collapse; margin: 12px 0; width: 100%; }
  .empty td, .empty th { border: 1px solid var(--border); padding: 6px 9px; text-align: left; font-size: 12px; }
  .kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--muted); }
  mark { background: #d2992233; color: inherit; }
  a.dl { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">
      <h1>Memory of my Pi</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search path, description, or content…" autocomplete="off"></div>
    <div class="filters" id="filters"></div>
    <div class="tree" id="tree"></div>
  </aside>
  <main>
    <div class="filehead" id="head"></div>
    <div class="content" id="content"></div>
  </main>
</div>
<script src="site-data.js"></script>
<script>
(function () {
  var D = window.PI_DUMP;
  if (!D) { document.body.innerHTML = '<p style="padding:40px">site-data.js missing. Run: node scripts/build-site.js</p>'; return; }

  document.getElementById('meta').innerHTML =
    D.files.length + ' files · ' + fmtBytes(D.stats.totalBytes) + '<br>' +
    'captured ' + new Date(D.generatedAt).toLocaleString() + '<br>' +
    'source <code>' + esc(D.source) + '</code>';

  var state = { q: '', cats: new Set(), active: null };
  var byPath = {};
  D.files.forEach(function (f) { byPath[f.path] = f; });

  var filtersEl = document.getElementById('filters');
  var chips = [{ name: '__all', label: 'all' }].concat(D.categories.map(function (c) { return { name: c.name, label: c.name + ' (' + c.files + ')' }; }));
  chips.forEach(function (c) {
    var el = document.createElement('span');
    el.className = 'chip' + (c.name === '__all' ? ' on' : '');
    el.textContent = c.label;
    el.onclick = function () {
      if (c.name === '__all') { state.cats.clear(); }
      else { state.cats.has(c.name) ? state.cats.delete(c.name) : state.cats.add(c.name); }
      Array.prototype.forEach.call(filtersEl.children, function (x) { x.classList.toggle('on', x.dataset.c === '__all' ? state.cats.size === 0 : state.cats.has(x.dataset.c)); });
      renderTree();
    };
    el.dataset.c = c.name;
    filtersEl.appendChild(el);
  });

  function visible(f) {
    if (state.cats.size && !state.cats.has(f.category)) return false;
    if (!state.q) return true;
    var q = state.q.toLowerCase();
    if (f.path.toLowerCase().indexOf(q) >= 0) return true;
    if (f.description && f.description.toLowerCase().indexOf(q) >= 0) return true;
    if (f.text && f.text.toLowerCase().indexOf(q) >= 0) return true;
    return false;
  }

  function buildTree(files) {
    var root = { dirs: {}, files: [] };
    files.forEach(function (f) {
      var parts = f.path.split('/');
      var node = root;
      for (var i = 0; i < parts.length - 1; i++) {
        node = node.dirs[parts[i]] || (node.dirs[parts[i]] = { dirs: {}, files: [] });
      }
      node.files.push(f);
    });
    return root;
  }

  function renderTree() {
    var tree = document.getElementById('tree');
    tree.innerHTML = '';
    D.categories.forEach(function (cat) {
      var files = D.files.filter(function (f) { return f.category === cat.name && visible(f); });
      if (!files.length) return;
      if (state.cats.size && !state.cats.has(cat.name)) return;
      var h = document.createElement('div');
      h.className = 'cat';
      h.textContent = cat.name + ' · ' + files.length;
      tree.appendChild(h);
      renderNode(buildTree(files), tree, 0);
    });
    if (!tree.children.length) {
      tree.innerHTML = '<div class="empty" style="padding:16px">No files match.</div>';
    }
  }

  function renderNode(node, parent, depth) {
    Object.keys(node.dirs).sort().forEach(function (d) {
      var el = document.createElement('div');
      el.className = 'node dir';
      el.style.paddingLeft = (8 + depth * 10) + 'px';
      el.innerHTML = '<span class="nm">' + esc(d) + '/</span>';
      var kids = document.createElement('div');
      el.onclick = function (e) { e.stopPropagation(); kids.style.display = kids.style.display === 'none' ? '' : 'none'; };
      parent.appendChild(el); parent.appendChild(kids);
      renderNode(node.dirs[d], kids, depth + 1);
    });
    node.files.sort(function (a, b) { return a.path.localeCompare(b.path); }).forEach(function (f) {
      var el = document.createElement('div');
      el.className = 'node file' + (state.active === f.path ? ' active' : '');
      el.style.paddingLeft = (22 + depth * 10) + 'px';
      var name = f.path.split('/').pop();
      el.innerHTML = '<span class="nm" title="' + escAttr(f.path) + '">' + esc(name) + '</span>' +
        (f.redacted ? '<span class="badge redact">redacted</span>' : '') +
        '<span class="count">' + fmtBytes(f.size) + '</span>';
      el.onclick = function () { show(f.path); };
      parent.appendChild(el);
    });
  }

  function show(p) {
    var f = byPath[p];
    if (!f) return;
    state.active = p;
    location.hash = p;
    var head = document.getElementById('head');
    head.innerHTML =
      '<div class="p">' + esc(f.path) + '</div>' +
      '<div class="info">' +
        'source <code>' + esc(f.source) + '</code> · ' + fmtBytes(f.size) +
        ' · sha256:' + f.sha256 +
        (f.redacted ? ' · <span style="color:var(--warn)">secrets redacted</span>' : '') +
      '</div>' +
      (f.description ? '<div class="desc">' + esc(f.description) + '</div>' : '');
    var content = document.getElementById('content');
    content.innerHTML = '';
    var pre = document.createElement('pre');
    pre.textContent = f.text || '(empty)';
    content.appendChild(pre);
    content.scrollTop = 0;
    renderTree();
  }

  function welcome() {
    document.getElementById('head').innerHTML = '<div class="p">README — what this is</div>';
    var content = document.getElementById('content');
    content.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'empty';
    div.innerHTML = [
      '<h2>What goes into this Pi agent</h2>',
      '<p>This artifact is a point-in-time snapshot of the configuration that turns a stock Pi install into <em>this</em> agent. Every file that shapes behaviour is mirrored under <code>dump/files/</code> and viewable here.</p>',
      '<table><tr><th>Layer</th><th>What it does</th></tr>',
      '<tr><td>Core Config</td><td>Provider + model, MCP servers, system prompt additions, global playbook (<code>AGENTS.md</code>).</td></tr>',
      '<tr><td>Extensions</td><td>Native code loaded into Pi (<code>caveman-native.js</code>).</td></tr>',
      '<tr><td>Skills</td><td>Local, vendored, and external skill procedures the agent can invoke.</td></tr>',
      '<tr><td>Memory</td><td>Durable user/agent memory and per-project memory.</td></tr>',
      '<tr><td>Packages</td><td>Installed Pi extensions and their versions.</td></tr>',
      '<tr><td>Install</td><td>Launchers, managed-install layout, active version.</td></tr>',
      '<tr><td>Pi Docs</td><td>Upstream Pi documentation shipped with the runtime.</td></tr>',
      '</table>',
      '<p>Pick a file in the left tree. Search (or press <span class="kbd">/</span>) filters by path, description, and full content. Secrets are replaced with <code>***REDACTED***</code> before capture.</p>',
      '<p>Regenerate with <code>node scripts/dump-config.js &amp;&amp; node scripts/build-site.js</code>.</p>'
    ].join('');
    content.appendChild(div);
  }

  function fmtBytes(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB'; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function escAttr(s) { return esc(s); }

  var q = document.getElementById('q');
  q.addEventListener('input', function () { state.q = q.value.trim(); renderTree(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });

  window.addEventListener('hashchange', function () {
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (h && byPath[h]) show(h); else if (!h) welcome();
  });

  renderTree();
  var initial = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (initial && byPath[initial]) show(initial); else welcome();
})();
</script>
</body>
</html>
